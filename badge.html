<title>Станция печати бейджей</title>
<style id="pg">@page{size:75mm 115mm;margin:0}</style>
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0d1226;color:#eef1ff;padding:16px}
.c{max-width:640px;margin:0 auto}
.card{background:#161d38;border:1px solid #2a3560;border-radius:14px;padding:16px;margin-bottom:14px}
input,select,button{font-size:1rem;padding:10px;border-radius:8px;border:1px solid #2a3560;background:#0d1226;color:#eef1ff;margin:3px 0;width:100%}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
button{background:#3a6bff;border:0;font-weight:700}
.sm{color:#9aa6c8;font-size:.85rem}
#st{font-size:1.3rem;font-weight:700}#log{color:#9aa6c8;font-size:.9rem;min-height:1.3em}
/* бейдж: дизайн 115x75 мм */
#badge{position:fixed;left:-300vw;top:0;width:115mm;height:75mm;background:#fff;color:#000;overflow:hidden;font-family:"DAX Pro","DAXPro","Dax","DIN Pro","DIN Alternate",Arial,sans-serif}
#badge .a{position:absolute;z-index:1}
#badge .c2{text-align:center;white-space:nowrap;overflow:hidden;line-height:1.12}
#badge .b{font-weight:800}#badge .nv{font-weight:700;color:#0c2a6b}
#badge .v{writing-mode:vertical-rl;transform:rotate(180deg);font-size:2.6mm;letter-spacing:.6mm;white-space:nowrap;color:#222;display:flex;align-items:center;justify-content:center}
#badge.bg::after{content:"\2708";position:absolute;right:-5mm;bottom:-9mm;font-size:46mm;line-height:1;color:#e8e8e8;transform:rotate(-20deg);z-index:0}
@media print{html,body{background:#fff!important;padding:0;margin:0}.c{display:none}#badge{position:absolute;left:0;top:0}#badge.rot{transform-origin:0 0;transform:translateX(var(--pw)) rotate(90deg)}#badge.rot2{transform-origin:0 0;transform:translateY(var(--ph)) rotate(-90deg)}}
</style>
</head>

KEEP.forEach(function(i){try{var v=localStorage.getItem("c_"+i);if(v)$(i).value=v}catch(e){}});
try{if(localStorage.getItem("c_bg")==="0")$("bgc").checked=false}catch(e){}
function save(){try{KEEP.forEach(function(i){localStorage.setItem("c_"+i,$(i).value)});localStorage.setItem("c_bg",$("bgc").checked?"1":"0")}catch(e){}}
function log(t){$("log").textContent=t}
function stat(){$("st").textContent="Ждут выдачи: "+wait.length+" · В печати: "+q.length+" · Напечатано: "+printed}
function api(a,x){return fetch(U+"?action="+a+"&key="+encodeURIComponent(K)+(x||""))}
function size(){var pw=parseFloat($("w").value)||75,ph=parseFloat($("h").value)||115,land=$("land").checked&&ph>pw;
  $("pg").textContent="@page{size:"+pw+"mm "+ph+"mm;margin:0}";var s=document.documentElement.style;
  s.setProperty("--pw",pw+"mm");s.setProperty("--ph",ph+"mm");
  $("badge").className=($("bgc").checked?"bg ":"")+(land?($("flip").checked?"rot2":"rot"):"")}
function fit(id,mm){var el=$(id);el.style.fontSize=mm+"mm";while(el.scrollWidth>el.clientWidth&&mm>2){mm-=.3;el.style.fontSize=mm+"mm"}}
function show(r){
  size();var d=$(r.day==="2"?"d2":"d1").value,id="ID "+r.tab;
  $("sN").textContent=$("mN").textContent=r.name;$("sS").textContent=$("mS").textContent=r.surname;
  $("sD").textContent=$("mD").textContent=d;$("sI").textContent=$("mI").textContent=id;
  fit("sN",6.5);fit("sS",4.2);fit("sD",3.5);fit("mT",4.1);fit("mN",11);fit("mS",5.2);fit("mD",5.8);
}
function printNow(r,cb){show(r);setTimeout(function(){window.print();setTimeout(cb,1500)},400)}
function render(){var el=$("wl");el.textContent="";wait.forEach(function(r){var d=document.createElement("div");d.className="r";var s=document.createElement("span");s.textContent=r.surname+" "+r.name+" · "+r.tab+" · день "+r.day;var bt=document.createElement("button");bt.textContent="Выдать бейдж";bt.onclick=function(){q.push(wait.splice(wait.indexOf(r),1)[0]);render();stat();next()};d.appendChild(s);d.appendChild(bt);el.appendChild(d)})}
function flush(){if($("auto").checked){q=q.concat(wait);wait=[]}render();stat();next()}
function poll(){api("pending").then(function(r){return r.json()}).then(function(rows){
  rows.forEach(function(r){if(!seen[r.row]){seen[r.row]=1;wait.push(r)}});flush();log("Работает, проверка каждые 3 с")})
  .catch(function(){log("Нет связи с таблицей (проверьте адрес, ключ и доступ «Все»), повтор…")})}
function next(){
  if(busy||!q.length)return;busy=true;var r=q.shift();
  printNow(r,function(){api("done","&row="+r.row).then(function(){printed++}).catch(function(){log("Не удалось отметить печать, строка "+r.row)}).then(function(){busy=false;stat();next()})});
}
$("go").onclick=function(){
  U=$("u").value.trim();K=$("k").value.trim();if(!U||!K){log("Введите адрес и ключ");return}
  save();size();clearInterval(timer);poll();timer=setInterval(poll,3000);
};
$("tst").onclick=function(){if(busy)return;save();busy=true;
  printNow({surname:"ABDRAKHMANOVA-KUZNETSOVA",name:"ALEXANDER",tab:"12345",day:"1"},function(){busy=false;next()})};
$("auto").onchange=flush;
$("add").onclick=function(){
  var s=$("ms").value.trim().toUpperCase(),n=$("mn").value.trim().toUpperCase(),t=$("mt").value.trim().toUpperCase();
  if(!s||!n||!t||!U){log("Заполните поля и нажмите Старт");return}
  fetch(U,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify([{surname:s,name:n,tab:t,day:$("md").value}])})
  .then(function(){["ms","mn","mt"].forEach(function(i){$(i).value=""});log("Добавлено, печать через пару секунд");setTimeout(poll,1500)});
};
</script>
</body>
</html>
