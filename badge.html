<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Станция печати бейджей</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style id="pg">@page{size:100mm 60mm;margin:0}</style>
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0d1226;color:#eef1ff;padding:16px}
.c{max-width:640px;margin:0 auto}
.card{background:#161d38;border:1px solid #2a3560;border-radius:14px;padding:16px;margin-bottom:14px}
input,select,button{font-size:1rem;padding:10px;border-radius:8px;border:1px solid #2a3560;background:#0d1226;color:#eef1ff;margin:3px 0;width:100%}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
button{background:#3a6bff;border:0;font-weight:700}
.sm{color:#9aa6c8;font-size:.85rem}
#st{font-size:1.3rem;font-weight:700}#log{color:#9aa6c8;font-size:.9rem;min-height:1.3em}
#badge{display:flex;position:fixed;left:-300vw;top:0;flex-direction:column;align-items:center;justify-content:center;width:var(--w,100mm);height:var(--h,60mm);padding:3mm 4mm;background:#fff;color:#000;text-align:center;overflow:hidden;position:fixed;font-family:"DAX Pro","DAXPro","Dax","DIN Pro","DIN Alternate",Arial,sans-serif}
#badge>*{position:relative;z-index:1}
#badge.bg::after{content:"\2708";position:absolute;right:2mm;bottom:-5mm;font-size:36mm;line-height:1;color:#e4e4e4;transform:rotate(-18deg);z-index:0}
#badge .s,#badge .n{width:100%;white-space:nowrap;overflow:hidden;font-weight:800;line-height:1.1}
#badge .n{font-weight:600}
#badge svg{width:calc(var(--w,100mm) - 20mm);height:calc(var(--h,60mm)*.26);margin:1.5mm 0}
#badge .m{font-size:3.4mm;margin-top:.5mm}
@media print{html,body{background:#fff!important;padding:0;margin:0}.c{display:none}#badge{position:absolute;left:0;top:0}#badge.rot{transform-origin:0 0;transform:translateX(var(--pw)) rotate(90deg)}#badge.rot2{transform-origin:0 0;transform:translateY(var(--ph)) rotate(-90deg)}}
</style>
</head>
<body>
<div class="c">
 <div class="card">
  <b>Подключение</b>
  <input id="u" placeholder="Адрес скрипта (/exec)" value="https://script.google.com/macros/s/AKfycbzQtnSgbqqLDmFXDgPs_b5CV8SjHtJJYJOQzsit5gA16d4OPZCBN_1TKNJ7IWGGkhOWWg/exec"><input id="k" type="password" placeholder="Ключ">
  <div class="r"><input id="w" type="number" value="75"><span class="sm">ширина бумаги, мм</span><input id="h" type="number" value="115"><span class="sm">длина бумаги, мм</span></div>
  <label class="sm" style="display:block;margin:6px 0"><input type="checkbox" id="land" style="width:auto" checked> Бейдж альбомный (текст вдоль длинной стороны)</label>
  <label class="sm" style="display:block;margin:6px 0"><input type="checkbox" id="flip" style="width:auto"> Развернуть на 180° (если печатается вверх ногами)</label>
  <label class="sm" style="display:block;margin:6px 0"><input type="checkbox" id="bgc" style="width:auto" checked> Лёгкий фон на бейдже (самолёт)</label>
  <div class="r"><button id="go">Старт</button><button id="tst" style="background:#2a3560">Тестовая печать</button></div>
 </div>
 <div class="card"><div id="st">Остановлено</div><div id="log"></div></div>
 <div class="card">
  <b>Выдача бейджей</b>
  <label style="display:block;margin:6px 0"><input type="checkbox" id="auto" style="width:auto" checked> Автопечать: бейдж печатается сразу после регистрации</label>
  <div id="wl"></div>
 </div>
 <div class="card">
  <b>Ручная регистрация (без телефона)</b>
  <div class="r"><input id="ms" placeholder="SURNAME"><input id="mn" placeholder="NAME"></div>
  <div class="r"><input id="mt" placeholder="ID"><select id="md"><option>1</option><option>2</option></select></div>
  <button id="add">Добавить и напечатать</button>
 </div>
</div>
<div id="badge"><div class="s" id="bs"></div><div class="n" id="bn"></div><svg id="bc"></svg><div class="m" id="bm"></div></div>
<script>
var $=function(i){return document.getElementById(i)},q=[],wait=[],busy=false,printed=0,seen={},timer=null,U="",K="";
["u","k"].forEach(function(i){try{var v=localStorage.getItem("b_"+i);if(v)$(i).value=v}catch(e){}});
try{if(localStorage.getItem("b_bg")==="0")$("bgc").checked=false}catch(e){}
function save(){try{["u","k"].forEach(function(i){localStorage.setItem("b_"+i,$(i).value)});localStorage.setItem("b_bg",$("bgc").checked?"1":"0")}catch(e){}}
function log(t){$("log").textContent=t}
function stat(){$("st").textContent="Ждут выдачи: "+wait.length+" · В печати: "+q.length+" · Напечатано: "+printed}
function api(a,x){return fetch(U+"?action="+a+"&key="+encodeURIComponent(K)+(x||""))}
function size(){var pw=parseFloat($("w").value)||75,ph=parseFloat($("h").value)||115,land=$("land").checked&&ph>pw;$("pg").textContent="@page{size:"+pw+"mm "+ph+"mm;margin:0}";var s=document.documentElement.style,W=land?ph:pw,H=land?pw:ph;s.setProperty("--w",W+"mm");s.setProperty("--h",H+"mm");s.setProperty("--pw",pw+"mm");s.setProperty("--ph",ph+"mm");$("badge").className=($("bgc").checked?"bg ":"")+(land?($("flip").checked?"rot2":"rot"):"");return H}
function fit(el,mm){while(el.scrollWidth>el.clientWidth&&mm>3){mm-=.4;el.style.fontSize=mm+"mm"}}
function show(r){
  var h=size();
  $("bs").textContent=r.surname;$("bn").textContent=r.name;$("bm").textContent="ID "+r.tab+" · Day "+r.day+" · FORUM NOVEMBER 2026";
  var bc=$("bc");
  try{JsBarcode(bc,String(r.tab),{format:"CODE128",displayValue:false,height:60,margin:0});
    var vw=parseFloat(bc.getAttribute("width")),vh=parseFloat(bc.getAttribute("height"));
    bc.setAttribute("viewBox","0 0 "+vw+" "+vh);bc.removeAttribute("width");bc.removeAttribute("height")}catch(e){}
  $("bs").style.fontSize=h*.21+"mm";$("bn").style.fontSize=h*.12+"mm";fit($("bs"),h*.21);fit($("bn"),h*.12);
}
function printNow(r,cb){show(r);setTimeout(function(){window.print();setTimeout(cb,1500)},300)}
function render(){var el=$("wl");el.textContent="";wait.forEach(function(r){var d=document.createElement("div");d.className="r";var s=document.createElement("span");s.textContent=r.surname+" "+r.name+" · "+r.tab+" · день "+r.day;var bt=document.createElement("button");bt.textContent="Выдать бейдж";bt.onclick=function(){q.push(wait.splice(wait.indexOf(r),1)[0]);render();stat();next()};d.appendChild(s);d.appendChild(bt);el.appendChild(d)})}
function flush(){if($("auto").checked){q=q.concat(wait);wait=[]}render();stat();next()}
function poll(){api("pending").then(function(r){return r.json()}).then(function(rows){
  rows.forEach(function(r){if(!seen[r.row]){seen[r.row]=1;wait.push(r)}});flush()})
  .catch(function(){log("Нет связи с таблицей, повтор…")})}
function next(){
  if(busy||!q.length)return;busy=true;var r=q.shift();
  printNow(r,function(){api("done","&row="+r.row).then(function(){printed++}).catch(function(){log("Не удалось отметить печать, строка "+r.row)}).then(function(){busy=false;stat();next()})});
}
$("go").onclick=function(){
  U=$("u").value.trim();K=$("k").value.trim();if(!U||!K){log("Введите адрес и ключ");return}
  save();size();clearInterval(timer);poll();timer=setInterval(poll,3000);log("Работает, проверка каждые 3 с");
};
$("tst").onclick=function(){if(busy)return;save();busy=true;
  printNow({surname:"ABDRAKHMANOVA-KUZNETSOVA",name:"ALEXANDER",tab:"12345",day:"1"},function(){busy=false;next()})};
$("auto").onchange=flush;
$("add").onclick=function(){
  var s=$("ms").value.trim().toUpperCase(),n=$("mn").value.trim().toUpperCase(),t=$("mt").value.trim().toUpperCase();
  if(!s||!n||!t||!U){log("Заполните поля и нажмите Старт");return}
  fetch(U,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify([{surname:s,name:n,tab:t,day:$("md").value}])})
  .then(function(){["ms","mn","mt"].forEach(function(i){$(i).value=""});log("Добавлено, печать через пару секунд");setTimeout(poll,1500)});
};
</script>
</body>
</html>
