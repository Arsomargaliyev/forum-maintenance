    else { ctx.fillStyle = '#fff'; ctx.fillRect(-PW / 2, -4, PW, 14); }
    ctx.restore();
    if (p.spring) { // coffee booster on the fuselage
      var x = cx, y = p.y;
      ctx.fillStyle = '#7a4a2b'; ctx.fillRect(x - 8, y - 15, 16, 14);
      ctx.fillStyle = '#e8d5b5'; ctx.fillRect(x - 8, y - 15, 16, 4);
      ctx.strokeStyle = '#7a4a2b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x + 10, y - 8, 4, -1.5, 1.5); ctx.stroke();
    }
  }

  // sprites are exported at one common scale; PK converts their pixels to game units
  var PK = PLH / 260;
  function drawEngineer(yOff) {
    var p = player;
    var pose;
    if (state === 'menu') pose = (yOff < -6) ? 'jump' : 'stand';
    else if (p.y > H * 0.72 && p.vy > 3) pose = 'fall';            // about to miss the planes
    else if (p.squash > 0) pose = 'stand';                          // push-off on a plane
    else if (p.vy < 0) pose = 'jump';
    else pose = 'stand';
    var im = pose === 'fall' ? IMG.engineer_fall : (pose === 'jump' ? IMG.engineer_jump : IMG.engineer);
    if (!im) im = IMG.engineer;
    var dw = im ? im.width * PK : PLW, dh = im ? im.height * PK : PLH;
    var sx = 1, sy = 1;
    if (pose === 'stand' && p.squash > 0) { sx = 1.12; sy = 0.85; }
    ctx.save();
    if (pose === 'fall') {
      // tumbling: centred on the body, tilted by sideways speed
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2 + (yOff || 0));
      ctx.rotate(clamp(p.vx * 0.03, -0.25, 0.25));
      ctx.scale(p.face, 1);
      if (im) ctx.drawImage(im, -dw / 2, -dh / 2, dw, dh);
    } else {
      ctx.translate(p.x + p.w / 2, p.y + p.h + (yOff || 0));
      ctx.rotate(clamp(p.vx * 0.03, -0.25, 0.25));
      ctx.scale(p.face * sx, sy);
      if (im) ctx.drawImage(im, -dw / 2, -dh, dw, dh);
      else { ctx.fillStyle = '#ff7a1a'; ctx.fillRect(-PLW / 2, -PLH, PLW, PLH); }
    }
    ctx.restore();
    if (boostTimer > 0) {
      ctx.fillStyle = 'rgba(255,170,40,0.85)';
      ctx.beginPath(); ctx.moveTo(p.x + 8, p.y + p.h); ctx.lineTo(p.x + p.w / 2, p.y + p.h + 22 + Math.random() * 8); ctx.lineTo(p.x + p.w - 8, p.y + p.h); ctx.fill();
    }
  }

  function text(str, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px system-ui, Arial, sans-serif';
    ctx.textAlign = align || 'center';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5);
    ctx.strokeStyle = 'rgba(8,20,48,0.8)'; ctx.strokeText(str, x, y);
    ctx.fillStyle = color || '#fff'; ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    if (!ready) {
      ctx.fillStyle = '#0e6fc0'; ctx.fillRect(0, 0, W, H);
      text('Загрузка...', W / 2, H / 2, 22, '#fff');
      return;
    }
    if (!player) reset();
    var hh = score / 10;

    drawSky(hh);
    drawSun(hh);
    drawStars(hh);
    drawSmallMoon(hh);
    BODIES.forEach(drawBody);
    drawEarth(hh);
    clouds.forEach(function (c) { drawCloud(c, hh); });
    birds.forEach(drawBird);
    drawCity();
    meteors.forEach(drawMeteor);
    flybys.forEach(drawFlyby);
    planes.forEach(function (p, i) { if (state !== 'menu' || i === 0) drawPlane(p, hh); });

    if (state === 'menu') drawEngineer(-Math.abs(Math.sin(tick * 0.07)) * 42);
    else drawEngineer(0);

    if (state === 'play') {
      text('Высота: ' + Math.floor(hh), 12, 28, 20, '#fff', 'left');
      text(STAGES[stageIndex(hh)][1], 12, 48, 13, '#bfe8ff', 'left');
      text('Рекорд: ' + best, W - 12, 28, 16, '#ffe27a', 'right');
    } else if (state === 'menu') {
      text('ASTANA JUMP', W / 2, 130, 44, '#ffd400');
      text('Инженер взлетает над Астаной', W / 2, 168, 17, '#fff');
      text('Прыгай по самолётам — выше, до космоса!', W / 2, 192, 14, '#fff');
      text('← → / A D  или тап слева и справа', W / 2, 250, 15, '#bfe8ff');
      text('Красные самолёты ломаются, кофе — буст', W / 2, 274, 13, '#fff');
      if (Math.floor(tick / 30) % 2 === 0) text('Нажми, чтобы начать', W / 2, 340, 22, '#fff');
      if (best) text('Рекорд: ' + best, W / 2, 372, 16, '#ffe27a');
    } else {
      ctx.fillStyle = 'rgba(8,20,48,0.6)'; ctx.fillRect(0, 0, W, H);
      text('Приземлился...', W / 2, 220, 34, '#ff8a8a');
      text('Высота: ' + Math.floor(score / 10), W / 2, 275, 26, '#fff');
      text('Долетел до: ' + STAGES[maxStage][1], W / 2, 308, 16, '#bfe8ff');
      text('Рекорд: ' + best, W / 2, 340, 20, '#ffe27a');
      if (overTimer === 0 && Math.floor(tick / 30) % 2 === 0) text('Нажми, чтобы сыграть ещё', W / 2, 410, 20, '#fff');
    }
  }

  // ---------- loop (fixed 60 fps logic) ----------
  var last = performance.now(), acc = 0, STEP = 1000 / 60;
  function frame(now) {
    acc += Math.min(now - last, 100); last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
