<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лотерея форума</title>
<style>
:root{--bg:#0b1630;--card:#111a33;--text:#eef1ff;--muted:#9aa6c8;--line:#2a3560;--gold:#ffd166;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px;background:#0d1226;border-bottom:1px solid var(--line);z-index:5}
.bar select,.bar input,.bar button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.95rem}
.bar input[type=number]{width:64px;padding:9px 6px}
.bar input[type=password]{width:120px}
.bar button{cursor:pointer}
.bar label{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:6px}
.bar .go{background:var(--gold);color:#3a2a00;border:0;font-weight:800;padding:10px 24px}
.bar .go:disabled{opacity:.45;cursor:default}
body.run .bar{display:none}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#hud{z-index:1;position:absolute;left:18px;top:12px;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.5);pointer-events:none;max-width:70%}
#hud b{font-size:1.25rem;letter-spacing:.02em}
#hud div{font-size:.98rem;margin-top:2px}
#res{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(6,12,30,.96);display:none;flex-direction:column;z-index:4}
#res.show{display:flex}
#res .hd{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-wrap:wrap}
#res h2{margin:0;font-size:1.6rem}
#rsub{color:var(--muted);margin-top:2px}
#res .acts{display:flex;gap:8px;flex-wrap:wrap}
#res button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:.95rem;cursor:pointer}
#res button.pri{background:var(--gold);color:#3a2a00;border:0;font-weight:800}
.grid{flex:1;overflow:auto;padding:6px 20px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;align-content:start}
.team{background:#121c3d;border:1px solid var(--line);border-radius:14px;overflow:hidden;opacity:0;transform:translateY(14px) scale(.97);animation:pop .5s forwards}
.team h3{margin:0;padding:8px 12px;font-size:1rem;color:#0b1020}
.team ol{margin:0;padding:8px 10px 10px 32px;font-size:.88rem;line-height:1.45}
@keyframes pop{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <select id="day"><option value="all">Все дни</option><option value="1">День 1</option><option value="2">День 2</option></select>
  <label>Команда от <input type="number" id="mn" value="10" min="2" max="50"> до <input type="number" id="mx" value="12" min="2" max="50"> чел.</label>
  <input type="password" id="key" placeholder="Ключ" autocomplete="off">
  <button id="live">Из таблицы</button>
  <button id="demo">Демо (150)</button>
  <button id="full" title="На весь экран">⛶</button>
  <button class="go" id="go" disabled>Запустить розыгрыш</button>
</div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"><b>Forum November 2026</b><div id="info"></div></div>
  <div id="res">
    <div class="hd">
      <div><h2>Команды сформированы</h2><div id="rsub"></div></div>
      <div class="acts"><button id="again" class="pri">Ещё раз</button><button id="back">К сцене</button><button id="csv">Скачать CSV</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<script>
(function(){
"use strict";
// Адрес Google Apps Script: список участников берётся прямо из таблицы (нужен ключ).
var ENDPOINT="https://script.google.com/macros/s/AKfycbx8HKcYrcjYB5KFnx6l2xo8x2Sw0k0bih0OS0KHwsqAP2GSDby5XXbLdHaSjHrx62PW/exec";
var $=function(i){return document.getElementById(i)};
var cv=$("cv"),ctx=cv.getContext("2d");
var W=0,H=0,dpr=1,PL={x0:0,x1:0,y0:0,y1:0},CS=40,LF=11,bg=null;
var all=[],people=[],mode="none",phase="idle",pt=0,T=0,teams=[],zones=[],curator=null,plane=null,planeImg=null,bubble=null,zoneA=0,running=false;
var CHAOS_T=6.5,SPEAK_T=2.8,SORT_T=4.8,HOLD_T=1.4;
var SHIRT=["#e4572e","#17bebb","#ffc914","#76b041","#7b6cf6","#ff7eb6","#2e86ab","#f18f01","#c73e1d","#3bb273","#e15a97","#4d908e"];
var SKIN=["#f6d3b3","#e9b98d","#d29a6a","#b87a4b","#8d5a3a","#fbe0c8"];
var HAIR=["#2b1d14","#4a2f1b","#1c1c1c","#7a4a21","#c9a227","#8a8a8a","#5a2d0c"];
var PANTS=["#2b2f4a","#3a3a3a","#1f3b5c","#5a4a3a","#4a2f4a"];
var CLOUDS=[{x:.1,y:.07,s:1,v:12},{x:.42,y:.2,s:1.3,v:8},{x:.7,y:.05,s:.8,v:15},{x:.92,y:.22,s:1.1,v:10}];

function rnd(){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function setInfo(t){$("info").textContent=t}

/* ---------- деление на команды поровну ---------- */
function plan(n,min,max){
  if(n<=0)return[];
  var t=(min+max)/2,best=null;
  for(var k=1;k<=n;k++){
    var lo=Math.floor(n/k),hi=Math.ceil(n/k);
    if(lo>=min&&hi<=max){var d=Math.abs(n/k-t);if(!best||d<best.d)best={k:k,d:d}}
  }
  var kk=best?best.k:Math.max(1,Math.round(n/t));
  var base=Math.floor(n/kk),r=n%kk,s=[];
  for(var i=0;i<kk;i++)s.push(base+(i<r?1:0));
  return s;
}

/* ---------- данные ---------- */
function parseCsv(t){
  var L=t.replace(/^﻿/,"").split(/\r?\n/).filter(Boolean);
  if(!L.length)return[];
  var h=L[0].toLowerCase().split(";");
  var ix=function(k){for(var i=0;i<h.length;i++)if(h[i].indexOf(k)>-1)return i;return -1};
  var a=ix("фам"),b=ix("имя"),c=ix("таб"),d=ix("ден");
  if(a<0)a=0;if(b<0)b=1;if(c<0)c=2;
  return L.slice(1).map(function(r){
    var x=r.split(";").map(function(v){return v.trim()});
    return{surname:x[a]||"",first:x[b]||"",tab:x[c]||"",day:d>-1?(x[d]||"").replace(/\D/g,"").charAt(0):""};
  }).filter(function(p){return p.surname||p.first});
}
function applyRows(rows){
  var df=$("day").value,seen={},list=[];
  rows.forEach(function(r){
    if(df!=="all"&&r.day!==df)return;
    var id=(r.tab||(r.surname+"|"+r.first)).toUpperCase();
    if(seen[id])return;seen[id]=1;
    list.push({surname:r.surname,first:r.first,tab:r.tab,id:id});
  });
  setPeople(list);
}
function newPerson(r){
  var sh=pick(SHIRT);
  return{id:r.id,surname:r.surname,first:r.first,tab:r.tab,
    x:PL.x0+Math.random()*(PL.x1-PL.x0),y:PL.y0+Math.random()*(PL.y1-PL.y0),
    dir:Math.random()*6.2832,turn:Math.random()*3,k:.7+Math.random()*.6,v:0,ph:Math.random()*6.28,
    skin:pick(SKIN),hair:pick(HAIR),pants:pick(PANTS),shirt:sh,shirt0:sh,sc:1,tsc:1,team:-1,mov:0,delay:0,cheer:false,
    tx:0,ty:0,col:null,colD:null,lab:null,lw:0,lh:0};
}
function setPeople(list){
  var old={};people.forEach(function(p){old[p.id]=p});
  var np=list.map(function(r){var p=old[r.id];if(p){p.surname=r.surname;p.first=r.first;return p}return newPerson(r)});
  var same=np.length===people.length&&np.every(function(p,i){return p===people[i]});
  people=np;
  if(!same)sizeChars();
  updateInfo();
}
function updateInfo(){
  var n=people.length,mn=Math.max(2,+$("mn").value||10),mx=Math.max(mn,+$("mx").value||12);
  $("go").disabled=running||n<2;
  if(!n){setInfo(mode==="none"?"Введите ключ и нажмите «Из таблицы» (или откройте демо)":"В таблице пока нет участников");return}
  var s=plan(n,mn,mx),lo=Math.min.apply(null,s),hi=Math.max.apply(null,s);
  setInfo("Участников: "+n+" · команд: "+s.length+" (по "+(lo===hi?lo:lo+"–"+hi)+")"+(mode==="demo"?" · демо":""));
}
function load(quiet){
  var k=$("key").value.trim();
  if(!k){setInfo("Введите ключ");return}
  try{localStorage.setItem("l_k",k)}catch(e){}
  mode="live";
  if(!quiet)setInfo("Загружаю список из таблицы…");
  fetch(ENDPOINT+"?action=csv&key="+encodeURIComponent(k)).then(function(r){return r.text()}).then(function(t){
    if(t.indexOf("Фамилия;")!==0){setInfo("Не удалось получить список: проверьте ключ и версию скрипта");return}
    all=parseCsv(t);
    if(!running)applyRows(all);
  }).catch(function(){setInfo("Нет связи с таблицей")});
}
function demo(){
  if(running)return;
  mode="demo";
  var MS=["AKHMETOV","SEITKALI","PETROV","SMIRNOV","ZHUMABAYEV","KIM","OMAROV","NURTAYEV","ABENOV","BEKTURGANOV","DOSMUKHAMEDOV","ERMEKOV","GALIYEV","ISMAILOV","KARIMOV","LEE","MUKHAMEDOV","ORAZOV","RAKHIMOV","SARSENOV"];
  var MN=["NURLAN","AIDAR","ANDREY","OLEG","YERLAN","TIMUR","RUSLAN","DAULET","SERGEY","ARMAN","DMITRY","KAIRAT","ASKAR","MAXIM","BAKYT"];
  var FS=["IVANOVA","KASYMOVA","BELOVA","POPOVA","ALIYEVA","BAYMUKHANOVA","DAULETOVA","ERKINOVA","FEDOROVA","KOZLOVA","MAKSUTOVA","NOVIKOVA","SADYKOVA","TLEUBAYEVA","VOLKOVA"];
  var FN=["MARIA","DANA","ANNA","OLGA","ELENA","ALIYA","MADINA","AIGERIM","ZHANNA","SAULE","IRINA","LYAZZAT","GULNARA","SVETLANA","ASEL"];
  var seen={},rows=[];
  while(rows.length<150){
    var f=rows.length>=80,s=pick(f?FS:MS),n=pick(f?FN:MN),key=s+"|"+n;
    if(seen[key])continue;seen[key]=1;
    var id="D"+(1000+rows.length);
    rows.push({surname:s,first:n,tab:String(1000+rows.length),id:id});
  }
  setPeople(rows);
}

/* ---------- размеры, фон, подписи ---------- */
function sizeChars(){
  var n=Math.max(people.length,1),area=(PL.x1-PL.x0)*(PL.y1-PL.y0);
  CS=clamp(Math.sqrt(area/n)*.45,20,48);
  LF=clamp(CS*.3,9,13);
  people.forEach(makeLabel);
}
function makeLabel(p){
  var c=document.createElement("canvas"),g=c.getContext("2d");
  var f1="700 "+LF+"px system-ui,'Segoe UI',Arial,sans-serif",f2="500 "+(LF*.92)+"px system-ui,'Segoe UI',Arial,sans-serif";
  g.font=f1;var w1=g.measureText(p.surname).width;
  g.font=f2;var w2=g.measureText(p.first).width;
  var maxW=Math.max(70,CS*2.5),k1=w1>maxW?maxW/w1:1,k2=w2>maxW?maxW/w2:1;
  var bw=Math.ceil(Math.max(w1*k1,w2*k2)+12),bh=Math.ceil(LF*2.15+7);
  c.width=Math.ceil(bw*dpr);c.height=Math.ceil(bh*dpr);
  g.scale(dpr,dpr);
  g.fillStyle="rgba(255,255,255,.92)";rr(g,0,0,bw,bh,7);g.fill();
  if(p.colD){g.lineWidth=2.2;g.strokeStyle=p.colD;rr(g,1,1,bw-2,bh-2,6);g.stroke()}
  g.textAlign="center";g.textBaseline="top";g.fillStyle="#0b1630";
  g.save();g.translate(bw/2,3.5);g.scale(k1,1);g.font=f1;g.fillText(p.surname,0,0);g.restore();
  g.save();g.translate(bw/2,3.5+LF*1.12);g.scale(k2,1);g.font=f2;g.fillText(p.first,0,0);g.restore();
  p.lab=c;p.lw=bw;p.lh=bh;
}
function buildBg(){
  bg=document.createElement("canvas");bg.width=Math.round(W*dpr);bg.height=Math.round(H*dpr);
  var g=bg.getContext("2d");g.scale(dpr,dpr);
  var s=g.createLinearGradient(0,0,0,PL.y0);s.addColorStop(0,"#3f86e6");s.addColorStop(1,"#c6e6ff");
  g.fillStyle=s;g.fillRect(0,0,W,H);
  var hy=PL.y0-24;
  var gr=g.createLinearGradient(0,hy,0,H);gr.addColorStop(0,"#86d58f");gr.addColorStop(1,"#4aa05f");
  g.fillStyle="#6fbf7d";g.beginPath();g.moveTo(0,hy+2);
  for(var x=0;x<=W;x+=40)g.lineTo(x,hy-10-Math.sin(x*.01)*8-Math.sin(x*.027)*5);
  g.lineTo(W,hy+2);g.closePath();g.fill();
  g.fillStyle=gr;g.fillRect(0,hy,W,H-hy);
  g.fillStyle="rgba(255,255,255,.05)";
  for(var y=hy+30,i=0;y<H;y+=40,i++){if(i%2)g.fillRect(0,y,W,20)}
}
function resize(){
  var r=$("stage").getBoundingClientRect();
  var nw=Math.max(320,Math.round(r.width)),nh=Math.max(320,Math.round(r.height));
  dpr=Math.min(2,window.devicePixelRatio||1);
  var sx=W?nw/W:1,sy=H?nh/H:1;
  W=nw;H=nh;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  PL={x0:24,x1:W-24,y0:Math.round(H*.37),y1:H-14};
  if(sx!==1||sy!==1)people.forEach(function(p){p.x*=sx;p.y*=sy});
  sizeChars();buildBg();
  if(teams.length&&(phase==="sort"||phase==="hold"||phase==="done"))layoutZones(phase!=="sort");
}

/* ---------- зоны команд ---------- */
function layoutZones(snap){
  zones=[];
  var k=teams.length;if(!k||!people.length)return;
  var hh=Math.max(20,CS*.55),aw=PL.x1-PL.x0,zy0=PL.y0-6,ah=PL.y1+6-zy0;
  var mmax=0;teams.forEach(function(t){mmax=Math.max(mmax,t.members.length)});
  var lwMax=0,lhMax=0;people.forEach(function(p){if(p.lw>lwMax)lwMax=p.lw;if(p.lh>lhMax)lhMax=p.lh});
  var best=null;
  for(var c=1;c<=k;c++){
    var rows=Math.ceil(k/c),cw=aw/c,ch=ah/rows,iw=cw-12,ih=ch-hh-6;
    if(iw<20||ih<20)continue;
    for(var g=1;g<=mmax;g++){
      var gr=Math.ceil(mmax/g),sc0=Math.min(1,(iw/g)/lwMax,(ih/gr)/(CS+lhMax+6));
      if(!best||sc0>best.sc+1e-6)best={c:c,g:g,sc:sc0};
    }
  }
  if(!best)best={c:Math.ceil(Math.sqrt(k)),g:Math.ceil(Math.sqrt(mmax)),sc:.5};
  var sc=Math.max(.45,best.sc),cols=best.c,rows2=Math.ceil(k/cols),cw2=aw/cols,ch2=ah/rows2,iw2=cw2-12,ih2=ch2-hh-6,gg=best.g,gr2=Math.ceil(mmax/gg);
  teams.forEach(function(t,i){
    var r=Math.floor(i/cols),cc=i%cols,inRow=(r===rows2-1)?k-(rows2-1)*cols:cols,ox=(cols-inRow)*cw2/2;
    var z={x:PL.x0+ox+cc*cw2+3,y:zy0+r*ch2+3,w:cw2-6,h:ch2-6,hh:hh,col:t.col,dark:t.dark,n:t.n};
    var sx=iw2/gg,sy=ih2/gr2;
    t.members.forEach(function(p,j){
      var col=j%gg,row=Math.floor(j/gg);
      var x=z.x+6+(col+.5)*sx,y=z.y+hh+(row+1)*sy-4;
      p.tx=x;p.ty=y;p.tsc=sc;p.team=i;
      if(snap){p.x=x;p.y=y;p.sc=sc}
    });
    zones.push(z);
  });
}
function assignTargets(){
  layoutZones(false);
  teams.forEach(function(t){
    t.members.forEach(function(p){p.shirt=t.shirt;p.col=t.col;p.colD=t.dark;p.delay=Math.random()*.8;makeLabel(p)});
  });
}

/* ---------- ход розыгрыша ---------- */
function go(ph){
  phase=ph;pt=0;
  if(ph==="plane")spawnPlane();
  if(ph==="speak")bubble={t:0};
}
function start(){
  if(running||people.length<2)return;
  var mn=Math.max(2,+$("mn").value||10),mx=Math.max(mn,+$("mx").value||12);
  var sizes=plan(people.length,mn,mx),order=shuffle(people.slice()),i=0;
  teams=sizes.map(function(sz,n){
    var h=(n*137.5)%360;
    var t={n:n+1,members:order.slice(i,i+sz),col:"hsl("+h.toFixed(0)+",70%,64%)",dark:"hsl("+h.toFixed(0)+",65%,38%)",shirt:"hsl("+h.toFixed(0)+",72%,50%)"};
    i+=sz;return t;
  });
  people.forEach(function(p){p.team=-1;p.col=null;p.colD=null;p.shirt=p.shirt0;p.tsc=1;p.cheer=false;p.delay=0;makeLabel(p)});
  curator=null;plane=null;bubble=null;zones=[];
  running=true;document.body.classList.add("run");
  $("res").classList.remove("show");$("go").disabled=true;
  go("chaos");
}
function spawnPlane(){
  var pw=clamp(W*.22,200,440);
  plane={x:-pw,y:H*.1,w:pw,h:pw*.32,v:(W+pw*2)/5.8};
}
function spawnCurator(){
  var cx=plane.x+plane.w*.55,cy=plane.y+plane.h*.5;
  curator={x:cx,y:cy,y0:cy,tx:cx,landY:PL.y0+(PL.y1-PL.y0)*.68,t:0,chute:0,landed:false,lt:0,alpha:1,ph:0};
}
function updatePlane(dt){
  if(!plane)return;
  plane.x+=plane.v*dt;
  if(!curator&&phase==="plane"&&plane.x+plane.w*.55>=W*.5)spawnCurator();
  if(plane.x>W+20)plane=null;
}
function updateCurator(dt){
  var c=curator;if(!c)return;
  c.t+=dt;c.ph+=dt*3;
  if(!c.landed){
    var u=Math.min(1,c.t/4.4);
    c.y=c.y0+(c.landY-c.y0)*(1-(1-u)*(1-u));
    c.x=c.tx+Math.sin(c.t*1.7)*28*(1-u);
    c.chute=clamp((c.t-.45)/.5,0,1);
    if(u>=1){c.landed=true;c.lt=0}
  }else{
    c.lt+=dt;c.chute=Math.max(0,1-c.lt/.8);
    if(phase==="plane")go("speak");
  }
  if(phase==="sort")c.alpha=clamp(1-(pt-2)/1.5,0,1);
  if(phase==="hold"||phase==="done")c.alpha=0;
}
function step(dt){
  pt+=dt;T+=dt;
  if(phase==="chaos"&&pt>CHAOS_T)go("plane");
  else if(phase==="speak"&&pt>SPEAK_T){assignTargets();go("sort")}
  else if(phase==="sort"&&pt>SORT_T)go("hold");
  else if(phase==="hold"&&pt>HOLD_T){go("done");curator=null;showResults()}
  if(bubble)bubble.t+=dt;
  updatePlane(dt);updateCurator(dt);
  var inZones=(phase==="sort"||phase==="hold"||phase==="done");
  zoneA=inZones?Math.min(1,zoneA+dt*1.2):Math.max(0,zoneA-dt*2);
  var target=phase==="chaos"?CS*7:(phase==="plane"?CS*1.3:(phase==="speak"?0:CS*.7));
  for(var i=0;i<people.length;i++){
    var p=people[i];
    p.sc+=(p.tsc-p.sc)*Math.min(1,dt*4);
    if(inZones&&p.team>=0){
      p.cheer=false;p.delay-=dt;
      if(p.delay>0){p.mov=0;continue}
      var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
      if(d<2){p.x=p.tx;p.y=p.ty;p.mov=0;continue}
      var v=Math.min(CS*9,d*4+CS*2);
      p.x+=dx/d*Math.min(v*dt,d);p.y+=dy/d*Math.min(v*dt,d);p.mov=1;p.ph+=dt*14;
      continue;
    }
    p.v+=(target*p.k-p.v)*Math.min(1,dt*3);
    p.turn-=dt;
    if(p.turn<=0){p.dir=Math.random()*6.2832;p.turn=phase==="chaos"?.3+Math.random()*.6:1.5+Math.random()*3}
    p.x+=Math.cos(p.dir)*p.v*dt;p.y+=Math.sin(p.dir)*p.v*dt*.6;
    if(p.x<PL.x0){p.x=PL.x0;p.dir=Math.PI-p.dir}else if(p.x>PL.x1){p.x=PL.x1;p.dir=Math.PI-p.dir}
    if(p.y<PL.y0){p.y=PL.y0;p.dir=-p.dir}else if(p.y>PL.y1){p.y=PL.y1;p.dir=-p.dir}
    p.mov=p.v>CS*.2?1:0;
    p.ph+=dt*(4+p.v/CS*1.6);
    p.cheer=(phase==="plane"||phase==="speak");
  }
}

/* ---------- рисование ---------- */
function drawChar(x,y,sz,o,up,cap){
  var s=sz/40,sw=o.mov?Math.sin(o.ph):0,i,sx;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle=o.pants;ctx.lineWidth=4.2;
  ctx.beginPath();ctx.moveTo(-2.6,-14);ctx.lineTo(-3+sw*6,-1);ctx.moveTo(2.6,-14);ctx.lineTo(3-sw*6,-1);ctx.stroke();
  ctx.fillStyle="#1d1d2b";
  ctx.beginPath();ctx.ellipse(-3+sw*6,0,3.2,1.8,0,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.ellipse(3-sw*6,0,3.2,1.8,0,0,6.2832);ctx.fill();
  ctx.fillStyle=o.shirt;rr(ctx,-6.8,-29,13.6,17,4.5);ctx.fill();
  ctx.strokeStyle=o.skin;ctx.lineWidth=3.2;ctx.fillStyle=o.skin;
  for(i=0;i<2;i++){
    sx=i?1:-1;
    var tx=up?sx*9.5:sx*8.6,ty=up?-37+Math.sin(o.ph*1.7+i*2)*2:-15.5+sx*sw*5;
    ctx.beginPath();ctx.moveTo(sx*6.2,-26.5);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.beginPath();ctx.arc(tx,ty,1.9,0,6.2832);ctx.fill();
  }
  ctx.fillStyle=o.skin;ctx.beginPath();ctx.arc(0,-35,7.2,0,6.2832);ctx.fill();
  ctx.fillStyle=o.hair;ctx.beginPath();ctx.arc(0,-35,7.5,Math.PI,6.2832);ctx.closePath();ctx.fill();
  ctx.fillStyle="#222";
  ctx.beginPath();ctx.arc(-2.6,-34.2,1.1,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.arc(2.6,-34.2,1.1,0,6.2832);ctx.fill();
  ctx.strokeStyle="#8a3b3b";ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,-33,2.8,.2,Math.PI-.2);ctx.stroke();
  if(cap){
    ctx.fillStyle="#0b2a6b";ctx.beginPath();ctx.arc(0,-36.5,7.9,Math.PI,6.2832);ctx.closePath();ctx.fill();
    ctx.fillStyle="#c9a24a";ctx.fillRect(-8.4,-37.2,16.8,2);
    ctx.fillStyle="#0b2a6b";ctx.fillRect(-8.8,-35.6,17.6,1.6);
  }
  ctx.restore();
}
function drawPerson(p){
  var sz=CS*p.sc,hopA=phase==="chaos"?5:(p.cheer?3:0);
  var hop=hopA?Math.abs(Math.sin(p.ph*.9))*hopA*sz/40:0;
  ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(p.x,p.y,sz*.26,sz*.07,0,0,6.2832);ctx.fill();
  drawChar(p.x,p.y-hop,sz,p,p.cheer,false);
  var lw=p.lw*p.sc,lh=p.lh*p.sc;
  ctx.drawImage(p.lab,p.x-lw/2,p.y-hop-sz*1.1-lh,lw,lh);
}
function drawChute(c,sz){
  var k=c.chute,r=sz*1.1*k,cx=c.x,cy=c.y-sz*1.5,hx=c.y-sz*.9,i;
  ctx.save();ctx.globalAlpha*=k;
  ctx.strokeStyle="rgba(40,40,60,.75)";ctx.lineWidth=1;
  [-1,-.5,0,.5,1].forEach(function(f){ctx.beginPath();ctx.moveTo(cx+f*r,cy);ctx.lineTo(cx+f*sz*.22,hx);ctx.stroke()});
  var cols=["#0b2a6b","#ffffff","#c9a24a","#ffffff","#0b2a6b"];
  for(i=0;i<5;i++){
    ctx.fillStyle=cols[i];ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,Math.PI+i*Math.PI/5,Math.PI+(i+1)*Math.PI/5);ctx.closePath();ctx.fill();
  }
  ctx.strokeStyle="#0b2a6b";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,6.2832);ctx.closePath();ctx.stroke();
  ctx.restore();
}
function drawCurator(){
  var c=curator,sz=CS*1.55;
  if(c.alpha<=0)return;
  ctx.save();ctx.globalAlpha=c.alpha;
  if(c.chute>.01)drawChute(c,sz);
  if(c.landed){ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(c.x,c.y,sz*.28,sz*.075,0,0,6.2832);ctx.fill()}
  drawChar(c.x,c.y,sz,{skin:"#e9b98d",hair:"#2b1d14",shirt:"#0b2a6b",pants:"#1b2340",ph:c.ph,mov:0},true,true);
  var f="800 "+Math.round(LF*1.05)+"px system-ui,'Segoe UI',Arial,sans-serif";
  ctx.font=f;var tw=ctx.measureText("КУРАТОР").width+14,th=LF*1.7;
  var lx=c.x-tw/2,ly=c.y-sz*1.12-th;
  ctx.fillStyle="#c9a24a";rr(ctx,lx,ly,tw,th,7);ctx.fill();
  ctx.fillStyle="#0b1630";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("КУРАТОР",c.x,ly+th/2+1);
  ctx.restore();
}
function drawBubble(){
  var c=curator;if(!c||!bubble)return;
  var fs=clamp(W/70,14,24),k=Math.min(1,bubble.t/.25);
  var l1="Внимание!",l2="Делимся на команды!";
  ctx.save();ctx.font="800 "+fs+"px system-ui,'Segoe UI',Arial,sans-serif";
  var w=Math.max(ctx.measureText(l1).width,ctx.measureText(l2).width)+34,h=fs*2.7;
  var sz=CS*1.55,bx=clamp(c.x-w/2,8,W-w-8),by=c.y-sz*1.12-LF*1.7-18-h;
  ctx.translate(c.x,by+h);ctx.scale(k,k);ctx.translate(-c.x,-(by+h));
  ctx.fillStyle="#fff";ctx.strokeStyle="#0b2a6b";ctx.lineWidth=3;
  rr(ctx,bx,by,w,h,14);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(c.x-10,by+h-1);ctx.lineTo(c.x,by+h+14);ctx.lineTo(c.x+10,by+h-1);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(c.x-10,by+h);ctx.lineTo(c.x,by+h+14);ctx.lineTo(c.x+10,by+h);ctx.stroke();
  ctx.fillStyle="#fff";ctx.fillRect(c.x-9,by+h-3,18,5);
  ctx.fillStyle="#0b1630";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(l1,bx+w/2,by+h*.32);ctx.fillText(l2,bx+w/2,by+h*.7);
  ctx.restore();
}
function drawPlane(){
  var p=plane,w=p.w,h=p.h;
  ctx.save();ctx.translate(p.x,p.y);
  if(planeImg){ctx.drawImage(planeImg,0,0,w,w*planeImg.height/planeImg.width);ctx.restore();return}
  ctx.fillStyle="#0b2a6b";ctx.beginPath();ctx.moveTo(w*.12,h*.46);ctx.lineTo(w*.03,0);ctx.lineTo(w*.15,0);ctx.lineTo(w*.3,h*.46);ctx.closePath();ctx.fill();
  ctx.fillStyle="#dfe6f3";ctx.strokeStyle="#9aa6c8";ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(w*.44,h*.58);ctx.lineTo(w*.28,h*.97);ctx.lineTo(w*.4,h*.97);ctx.lineTo(w*.66,h*.6);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle="#cfd8ea";ctx.beginPath();ctx.ellipse(w*.47,h*.8,w*.06,h*.055,0,0,6.2832);ctx.fill();ctx.stroke();
  ctx.save();ctx.beginPath();ctx.ellipse(w*.5,h*.56,w*.49,h*.18,0,0,6.2832);ctx.clip();
  ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#0b2a6b";ctx.fillRect(0,h*.6,w,h);
  ctx.fillStyle="#c9a24a";ctx.fillRect(0,h*.585,w,h*.022);
  ctx.restore();
  ctx.strokeStyle="#9aa6c8";ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(w*.5,h*.56,w*.49,h*.18,0,0,6.2832);ctx.stroke();
  ctx.fillStyle="#0b2a6b";
  for(var i=0;i<12;i++){ctx.beginPath();ctx.arc(w*(.3+i*.04),h*.5,h*.025,0,6.2832);ctx.fill()}
  ctx.beginPath();ctx.ellipse(w*.88,h*.5,w*.03,h*.045,0,0,6.2832);ctx.fill();
  ctx.strokeStyle="#0b2a6b";ctx.lineWidth=1.2;rr(ctx,w*.53,h*.4,w*.05,h*.19,3);ctx.stroke();
  ctx.restore();
}
function drawZones(){
  ctx.save();ctx.globalAlpha=zoneA;
  ctx.textAlign="left";ctx.textBaseline="middle";
  zones.forEach(function(z){
    ctx.fillStyle=z.col.replace("hsl(","hsla(").replace(")",",.22)");
    rr(ctx,z.x,z.y,z.w,z.h,14);ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=z.dark;ctx.stroke();
    ctx.fillStyle=z.col;rr(ctx,z.x,z.y,z.w,z.hh,10);ctx.fill();
    ctx.fillStyle="#0b1020";ctx.font="800 "+Math.round(z.hh*.58)+"px system-ui,'Segoe UI',Arial,sans-serif";
    ctx.fillText("КОМАНДА №"+z.n,z.x+10,z.y+z.hh/2+1);
  });
  ctx.restore();
}
var order=[];
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(bg,0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.85)";
  CLOUDS.forEach(function(c){
    var x=((c.x*W+T*c.v)%(W+320))-160,y=c.y*H,s=c.s*W/1600+.3;
    ctx.beginPath();ctx.arc(x,y,26*s,0,6.2832);ctx.arc(x+30*s,y-8*s,22*s,0,6.2832);ctx.arc(x-30*s,y+4*s,20*s,0,6.2832);ctx.arc(x+56*s,y+6*s,16*s,0,6.2832);ctx.fill();
  });
  if(plane)drawPlane();
  if(zoneA>0)drawZones();
  order.length=0;
  for(var i=0;i<people.length;i++)order.push(people[i]);
  if(curator&&curator.landed)order.push(curator);
  order.sort(function(a,b){return a.y-b.y});
  for(i=0;i<order.length;i++){if(order[i]===curator)drawCurator();else drawPerson(order[i])}
  if(curator&&!curator.landed)drawCurator();
  if(bubble&&curator&&phase==="speak")drawBubble();
}
var last=0;
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  step(dt);draw();
  requestAnimationFrame(frame);
}

/* ---------- результаты ---------- */
function showResults(){
  var g=$("grid");g.textContent="";
  teams.forEach(function(t,i){
    var d=document.createElement("div");d.className="team";d.style.animationDelay=(i*.08)+"s";
    var h=document.createElement("h3");h.style.background=t.col;h.textContent="Команда №"+t.n+" · "+t.members.length+" чел.";
    var ol=document.createElement("ol");
    t.members.forEach(function(p){var li=document.createElement("li");li.textContent=p.surname+" "+p.first;ol.appendChild(li)});
    d.appendChild(h);d.appendChild(ol);g.appendChild(d);
  });
  $("rsub").textContent="Участников: "+people.length+" · команд: "+teams.length;
  $("res").classList.add("show");
}
function toStage(){
  $("res").classList.remove("show");
  running=false;document.body.classList.remove("run");updateInfo();
}
function dl(){
  var rows=["Команда;Фамилия;Имя;Табельный"];
  teams.forEach(function(t){t.members.forEach(function(p){rows.push([t.n,p.surname,p.first,p.tab].join(";"))})});
  var blob=new Blob(["﻿"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="teams.csv";
  document.body.appendChild(a);a.click();a.remove();
}

/* ---------- запуск ---------- */
try{var sk=localStorage.getItem("l_k");if(sk)$("key").value=sk}catch(e){}
$("live").onclick=function(){load(false)};
$("demo").onclick=demo;
$("go").onclick=start;
$("again").onclick=function(){$("res").classList.remove("show");running=false;start()};
$("back").onclick=toStage;
$("csv").onclick=dl;
$("day").onchange=function(){if(mode==="live"&&!running)applyRows(all)};
$("mn").oninput=$("mx").oninput=updateInfo;
$("full").onclick=function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen()};
/* Необязательно: положите рядом plane.png (самолёт, нос вправо), и он заменит нарисованный самолёт. */
(function(){var im=new Image();im.onload=function(){planeImg=im};im.src="plane.png"})();
resize();
if(window.ResizeObserver)new ResizeObserver(resize).observe($("stage"));else window.addEventListener("resize",resize);
updateInfo();
if($("key").value)load(false);
setInterval(function(){if(mode==="live"&&!running&&(phase==="idle"||phase==="done"))load(true)},20000);
requestAnimationFrame(frame);
})();
</script>
