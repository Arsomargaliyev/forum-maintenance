<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Викторина форума</title>
<style>
:root{--text:#eef1ff;--muted:#9fb0cf;--card:transparent;--gold:#D2AA76;--ok:#2fd27a;--bad:#ff5a6a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100svh;color:var(--text);font-family:I,Arial,sans-serif;font-weight:700;background:#010c18}
@font-face{font-family:I;src:url(q/inter.woff) format("woff");font-weight:700;font-display:swap}
#tail{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(88vw,440px);aspect-ratio:907/834;object-fit:cover;z-index:-1;pointer-events:none;transition:opacity .6s;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 80%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 80%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 22%);mask-composite:intersect}
body.quiet #tail{opacity:.18}
#brand{text-align:center;padding-top:8px}#brand .lo{height:30px}#brand .ti{display:block;width:92%;margin:16px auto 0}#brand .li{height:1px;width:40%;background:var(--gold);opacity:.55;margin:18px auto 10px}
body.quiet #brand{display:none}
.w{max-width:480px;margin:0 auto;padding:18px 18px 40vw}body.quiet .w{padding-bottom:18px}
.card{background:var(--card);border-radius:22px;padding:20px;text-align:center;display:none;}
.card.on{display:block;animation:cardIn .5s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
h1{margin:0 0 8px;font-size:1.3rem;font-weight:700;line-height:1.35}
input::placeholder{color:#6f84a8}
input{width:100%;font-size:1.1rem;padding:14px;border-radius:12px;border:1.5px solid #253d63;background:#0a1830;color:#fff;font-family:I,Arial,sans-serif;font-weight:700;margin:6px 0;text-align:center;transition:border-color .2s}
input:focus{outline:none;border-color:var(--gold)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.go{width:100%;margin-top:10px;padding:18px;font-size:1.1rem;font-weight:700;border:0;border-radius:14px;background:var(--gold);color:#24180a;transition:transform .12s}
.go:active{transform:scale(.97)}
.go.o{background:transparent!important;border:1.5px solid var(--gold);color:var(--gold)}
.er{color:#ff8c8c;min-height:1.3em;margin-top:8px}
.hint{color:var(--muted);font-size:.92rem;line-height:1.45;margin-top:10px}
#hd{display:none;margin-bottom:12px}#hq{font-weight:800;color:var(--muted);text-align:center;margin-bottom:6px;font-size:1.05rem}
#ln{position:relative;height:36px;border-radius:10px;background:#0a1830;border:1px solid #1b2f50;overflow:hidden}
#ln:before{content:"";position:absolute;left:10px;right:10px;top:17px;border-top:2px dashed rgba(210,170,118,.45)}
#pp{position:absolute;top:3px;left:10px;width:76px;height:auto;transition:left 1.4s cubic-bezier(.3,.9,.3,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#fly{position:relative;height:90px;margin:4px 0 10px;overflow:hidden}
#fly img{position:absolute;left:50%;top:22px;width:130px;margin-left:-65px;animation:hover 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
#fly i{position:absolute;left:50%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55));animation:wind 1.6s linear infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes wind{from{transform:translateX(200px);opacity:0}20%{opacity:1}to{transform:translateX(-300px);opacity:0}}
#m{font-size:1.25rem;font-weight:700;line-height:1.5}
.dots:after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#big{font-size:5.5rem;font-weight:900;color:var(--gold);line-height:1;margin:6px 0}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
#ring{position:relative;width:62px;height:62px;flex:none}
#ring svg{width:62px;height:62px;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:6}
#ring .bg{stroke:rgba(255,255,255,.15)}#ring .fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:170;transition:stroke .3s}
#cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900}
#ring.hot .fg{stroke:var(--bad)}#ring.hot #cdn{color:var(--bad);animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.18)}}
#ac{color:var(--muted);font-size:.9rem;text-align:right}
#qt{font-size:1.25rem;font-weight:800;margin:6px 0 14px;line-height:1.3;animation:qIn .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#ob{display:grid;gap:10px}
#ob button{position:relative;border:0;border-radius:16px;padding:20px 14px 20px 52px;color:#fff;font-family:I,Arial,sans-serif;font-weight:700;font-size:1.08rem;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.28);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),opacity .25s,filter .25s;animation:bIn .35s cubic-bezier(.2,1.3,.4,1) both}
#ob button b{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.3rem;opacity:.9}
#ob button:nth-child(2){animation-delay:.04s}#ob button:nth-child(3){animation-delay:.08s}#ob button:nth-child(4){animation-delay:.12s}
@keyframes bIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
#ob.done button{pointer-events:none}
#ob.done button:not(.sel){opacity:.28;filter:grayscale(.6);transform:scale(.97)}
#ob button.sel{animation:chosen .5s cubic-bezier(.2,1.5,.4,1) both;outline:3px solid #fff;outline-offset:2px}
@keyframes chosen{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.c0{background:#c8243d}.c1{background:#1d5fb8}.c2{background:#b88a00}.c3{background:#2a7a1c}
#qa{min-height:1.4em;margin-top:12px;font-weight:700;color:var(--ok)}
#qa.in{animation:qIn .35s both}
#ic{width:96px;height:96px;margin:4px auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:900;color:#fff}
#ic.ok{background:var(--ok);box-shadow:0 0 0 0 rgba(47,210,122,.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both,ring 1.4s .3s ease-out}
#ic.no{background:var(--bad);animation:pop .5s both,shake .45s .45s}
#ic.to{background:#4a5578;animation:pop .5s both}
@keyframes ring{to{box-shadow:0 0 0 26px rgba(47,210,122,0)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#rt{font-size:1.7rem;font-weight:900}
#rp{font-size:2.6rem;font-weight:900;color:var(--gold);margin:4px 0}
#rr{font-size:1.1rem;font-weight:700;line-height:1.5}
.up{color:var(--ok)}.dn{color:var(--bad)}
#rc{margin-top:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);font-size:.95rem;line-height:1.5}
.t5{margin-top:14px;text-align:left;font-size:1rem}.t5 h4{margin:0 0 2px;color:var(--muted);text-align:center}
.t5 div{display:flex;gap:10px;padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:5px;animation:rowIn .4s cubic-bezier(.2,.9,.3,1.1) both}
.t5 span{flex:1}.t5 div.me{background:rgba(210,170,118,.32);font-weight:800}
@keyframes rowIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.spin{width:54px;height:54px;margin:10px auto;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cf{position:fixed;top:-20px;z-index:9;pointer-events:none;width:9px;height:14px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

// Синхронизация часов с сервером: 5 замеров, берём самый быстрый (его меньше всего исказила сеть).
function sync(n,best,cb){
  var t0=performance.now();
  api("qstate").then(function(s){var t1=performance.now(),rtt=t1-t0,o=s.now+rtt/2-Date.now();
    if(!best||rtt<best.rtt)best={rtt:rtt,off:o,s:s};
    if(n>1)setTimeout(function(){sync(n-1,best,cb)},150);else cb(best)})
  .catch(function(){if(best)cb(best);else setTimeout(function(){sync(n,best,cb)},1500)});
}
function poll(){

    setTimeout(poll,G.startAt?1500:6000+Math.random()*3000);
  }).catch(function(){setTimeout(poll,4000)});
}

}
function send(k,c,t,n){
  fetch(U+"?action=qans&p="+me.p+"&q="+k+"&c="+c+"&t="+t.toFixed(3),{cache:"no-store",keepalive:true})
  .then(function(r){return r.json()}).then(function(r){if(r&&r.err==="no"&&n<3)setTimeout(function(){send(k,c,t,n+1)},300)})
  .catch(function(){if(n<4)setTimeout(function(){send(k,c,t,n+1)},250)});
}
function prog(k){if(pgk!==k)return;api("qprog","&q="+k).then(function(r){if(pgk===k&&r&&r.a!=null){PR=r;paint()}}).catch(function(){});setTimeout(function(){prog(k)},1000+Math.random()*500)}
function paint(){if(!PR)return;var t=S().ans(PR.a,PR.of);$("ac").textContent=t;if($("wc"))$("wc").textContent=t}
function head(k){$("hd").style.display="block";$("hq").textContent=S().q+" "+(k+1)+" / "+QS.length}
function plane(sc){$("pp").style.left="calc(10px + (100% - 96px)*"+Math.min(1,sc/(QS.length*900))+")"}

function endQ(k){
  phase="r";var s=S();
  if(chosen<0)$("ob").classList.add("done");
  $("rw").innerHTML="<div class='spin'></div><div style='font-weight:800;font-size:1.2rem'><span class='dots'>"+esc(s.calc)+"</span></div><div class='hint' id='wc'></div>";
  restart("rs");show("rs");
  setTimeout(function again(){
    if(cur!==k)return;
    api("qres","&q="+k+"&p="+me.p).then(function(r){
      if(r.wait){setTimeout(again,450+Math.random()*300);return}
      if(cur===k)result(k,r)}).catch(function(){setTimeout(again,1200)})},2700+Math.random()*700);
}
function result(k,r){
  var s=S(),m=r.my,last=k===QS.length-1,kk=LG==="kk",q=QS[k],ok=m.pts>0,to=chosen<0;
  var cls=ok?"ok":to?"to":"no",icon=ok?"✓":to?"⏱":"✕",title=ok?s.ok:to?s.to:s.no;
  var d=prevRk?prevRk-m.rk:0;prevRk=m.rk;
  var mv=d>0?" <span class='up'>▲"+d+"</span>":d<0?" <span class='dn'>▼"+(-d)+"</span>":"";
  var right=r.c!=null?"<div id='rc'>"+esc(s.right)+": <b>"+SH[r.c]+" "+esc((kk?q.ko:q.o)[r.c])+"</b>"+(chosen>=0?"<br>"+esc(s.time((myT/1000).toFixed(3))):"")+"</div>":"";
  $("rw").innerHTML="<div id='ic' class='"+cls+"'>"+icon+"</div><div id='rt'>"+esc(title)+"</div>"+
    "<div id='rp'>"+(ok?"+0":"0")+"</div>"+
    "<div id='rr'>"+(last?esc(s.fin(m.rk,m.of)):esc(s.place(m.rk,m.of))+mv+"<br>"+esc(s.tot(m.s)))+"</div>"+right+"<div class='hint'>"+esc(s.ans(m.a,m.of))+"</div>"+
    (last?"<div class='hint' style='font-size:1.05rem;color:#fff'>"+esc(s.thanks)+"</div>":"")+t5(r.top,s);
  restart("rs");show("rs");
  vib(ok?[30,60,30]:to?40:80);
  if(ok)countUp($("rp"),m.pts,900);
  setTimeout(function(){plane(m.s)},300);
  if((last&&m.rk<=3)||(ok&&m.rk===1))confetti(last?120:40);
}
function countUp(el,to,ms){var t0=performance.now();(function f(t){var p=Math.max(0,Math.min(1,(t-t0)/ms)),e=1-Math.pow(1-p,3);el.textContent="+"+Math.round(to*e);if(p<1)requestAnimationFrame(f);else el.className="pop"})(t0)}
function t5(top,s){return"<div class='t5'><h4>"+esc(s.top)+"</h4>"+(top||[]).map(function(x,i){return"<div style='animation-delay:"+(.25+i*.08)+"s'"+(x.p===me.p?" class='me'":"")+"><b>"+(i+1)+"</b><span>"+esc(x.n)+"</span><em style='font-style:normal'>"+x.s+"</em></div>"}).join("")+"</div>"}
function confetti(n){var C=["#D2AA76","#2fd27a","#1368ce","#e21b3c","#ffffff"];for(var i=0;i<n;i++){var c=document.createElement("div");c.className="cf";c.style.left=Math.random()*100+"vw";c.style.background=C[i%C.length];document.body.appendChild(c);
  var x=(Math.random()-.5)*160,dur=2200+Math.random()*1800;
  c.animate([{transform:"translate(0,0) rotate(0)"},{transform:"translate("+x+"px,"+(innerHeight+40)+"px) rotate("+(360+Math.random()*720)+"deg)"}],{duration:dur,delay:Math.random()*500,easing:"cubic-bezier(.2,.6,.4,1)"}).onfinish=function(){this.effect.target.remove()}}}
if(LG){texts();me?begin():show("fm")}else show("lg");
</script>
