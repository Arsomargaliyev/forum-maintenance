body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(5,11,26,.4),rgba(5,11,26,.8));z-index:-1}
.w{max-width:480px;margin:0 auto;padding:18px}
.card{background:var(--card);border-radius:20px;padding:20px;text-align:center}
h1{margin:0 0 8px;font-size:1.5rem}
input{width:100%;font-size:1.1rem;padding:14px;border-radius:12px;border:1.5px solid #38457a;background:#0b1430;color:var(--text);margin:6px 0;text-align:center}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:10px;padding:16px;font-size:1.1rem;font-weight:800;border:0;border-radius:12px;background:var(--gold);color:#3a2a00}
.er{color:#ff8c8c;min-height:1.3em;margin-top:8px}
#fm,#wt,#qq{display:none}
#fm{display:block}
#bar{height:10px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin:10px 0}
#barf{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffc83d,#ff7b3d)}
#qt{font-size:1.25rem;font-weight:700;margin:8px 0 12px}
#ob{display:grid;gap:10px}
#ob button{border:0;border-radius:16px;padding:20px 12px;color:#fff;font-weight:800;font-size:1.1rem}
#ob button:disabled{opacity:.4}#ob button.sel{opacity:1;outline:3px solid #fff}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
#m{font-size:1.15rem;font-weight:700;line-height:1.5}.hint{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="w">
 <div class="card" id="fm"><h1>Викторина форума</h1><p class="hint">Name and surname in English / Имя и фамилия латиницей</p>
  <input id="fn" placeholder="NAME" autocapitalize="characters" autocomplete="given-name"><input id="fs" placeholder="SURNAME" autocapitalize="characters" autocomplete="family-name">
  <button class="go" id="jn">Войти в игру / Join</button><div class="er" id="er"></div></div>
 <div class="card" id="wt"><div id="m"></div><div class="hint" id="jc"></div></div>
 <div class="card" id="qq"><div class="hint" id="qn"></div><div id="bar"><i id="barf"></i></div><div id="qt"></div><div id="ob"></div></div>
</div>
<script>
var U="https://script.google.com/macros/s/AKfycbzQtnSgbqqLDmFXDgPs_b5CV8SjHtJJYJOQzsit5gA16d4OPZCBN_1TKNJ7IWGGkhOWWg/exec",$=function(i){return document.getElementById(i)},me=null,off=0,G=null,QS=null,last="",qStart=0,chosen=-1,SH=["▲","◆","●","■"];
try{me=JSON.parse(localStorage.getItem("pq")||"null")}catch(e){}
function api(a,x){return fetch(U+"?action="+a+(x||"")).then(function(r){return r.json()})}
function show(id){["fm","wt","qq"].forEach(function(i){$(i).style.display=i===id?"block":"none"})}
function msg(h){$("m").innerHTML=h}
$("jn").onclick=function(){
  var a=$("fn").value.trim(),b=$("fs").value.trim();$("er").textContent="";
  api("qjoin","&name="+encodeURIComponent(a)+"&sur="+encodeURIComponent(b)).then(function(r){
    if(r.err==="closed"){$("er").textContent="Игра ещё не открыта / Game is not open yet";return}
    if(r.err){$("er").textContent="Только латинские буквы / Latin letters only";return}
    me=r;try{localStorage.setItem("pq",JSON.stringify(r))}catch(e){}begin()}).catch(function(){$("er").textContent="Нет связи / No connection"});
};
function begin(){show("wt");msg("Вы в игре / You are in:<br>"+me.n+"<br>Ждите старта / Wait for start");poll()}
function poll(){
  api("qstate").then(function(s){
    off=s.now-Date.now();G=s.g;
    if(!G||G.gid!==me.gid){me=null;try{localStorage.removeItem("pq")}catch(e){}show("fm");$("er").textContent="Игра обновлена, войдите снова / Please join again";return}
    $("jc").textContent=s.jc?("Игроков: "+s.jc):"";
    if(G.startAt&&!QS&&G.startAt-(Date.now()+off)<17000)api("qcfg").then(function(q){QS=q});
    if(!QS)setTimeout(poll,9000+Math.random()*5000);
  }).catch(function(){setTimeout(poll,6000+Math.random()*4000)});
}
setInterval(function(){
  if(!G||!G.startAt||!QS||!me)return;
  var t=Date.now()+off-G.startAt,cyc=G.T+G.R;
  if(t<0){show("wt");msg("Старт через / Starts in<br>"+Math.ceil(-t/1000)+" c");return}
  var k=Math.floor(t/cyc);
  if(k>=QS.length){if(last!=="end"){last="end";msg($("m").innerHTML+"<br>Игра окончена, спасибо! / Game over")}return}
  var ph=t%cyc;
  if(ph<G.T){$("barf").style.width=(100-ph/G.T*100)+"%";if(last!==k+"a"){last=k+"a";showQ(k)}}
  else if(last!==k+"r"){last=k+"r";result(k)}
},200);
function showQ(k){
  show("qq");chosen=-1;qStart=G.startAt+k*(G.T+G.R);var q=QS[k],sv=null;try{sv=JSON.parse(localStorage.getItem("pa")||"null")}catch(e){}if(sv&&sv.g===G.gid&&sv.k===k)chosen=sv.c;
  $("qn").textContent="Вопрос "+(k+1)+" / "+QS.length;$("qt").textContent=q.q;$("ob").innerHTML="";
  q.o.forEach(function(t,i){var b=document.createElement("button");b.className="c"+i;b.textContent=SH[i]+" "+t;
    b.onclick=function(){if(chosen>=0)return;chosen=i;try{localStorage.setItem("pa",JSON.stringify({g:G.gid,k:k,c:i}))}catch(e){}var tt=Math.round(Date.now()+off-qStart);
      [].forEach.call($("ob").children,function(x){x.disabled=true});b.classList.add("sel");
      var tries=0;(function send(){api("qans","&p="+me.p+"&q="+k+"&c="+i+"&t="+tt).then(function(r){if(r&&r.err==="late")return}).catch(function(){if(++tries<5&&last===k+"a")setTimeout(send,600+Math.random()*600)})})()};
    if(chosen>=0){b.disabled=true;if(i===chosen)b.classList.add("sel")}$("ob").appendChild(b)});
}
function result(k){
  show("wt");msg(chosen>=0?"Ответ принят. Подсчёт…":"Время вышло. Подсчёт…");
  setTimeout(function again(){api("qres","&q="+k+"&p="+me.p).then(function(r){
    if(r.wait){if(last===k+"r")setTimeout(again,1500+Math.random()*2000);return}
    var ok=chosen===r.correct;
    msg((chosen<0?"⏱ Не успели":ok?"✅ Верно!":"❌ Неверно")+(r.my.pts?" +"+r.my.pts:"")+"<br>Правильный ответ: "+QS[k].o[r.correct]+"<br>Всего очков: "+r.my.s+"<br>Ваше место: "+r.my.rk+" из "+r.my.of)}).catch(function(){setTimeout(again,2000+Math.random()*2500)})},2500+(me.p%25)*180+Math.random()*200);
}
if(me)begin();
</script>
</body>
</html>
