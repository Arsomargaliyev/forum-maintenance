<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forum November 2026 — Maintenance</title>
<style>
:root{--bg:#05080f;--card:#111a33;--text:#eef1ff;--muted:#9aa6c8;--line:#2a3560;--accent:#3a6bff;--ok:#4ade80;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.poster{position:relative;width:fit-content;max-width:100%;margin:0 auto}
.poster img{display:block;max-width:100%;max-height:100svh;width:auto;height:auto}
.go{position:absolute;left:50%;top:67%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#12206b;font-weight:800;font-size:clamp(1rem,4vw,1.25rem);padding:16px 34px;border-radius:999px;text-decoration:none;box-shadow:0 8px 30px rgba(58,107,255,.45)}
main{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
h2{margin:0 0 6px;font-size:1.4rem}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text]{width:100%;font-size:1.05rem;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text)}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
.days{display:flex;gap:10px;flex-wrap:wrap}
.days label{flex:1;margin:0;display:flex;gap:8px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;min-width:120px}
.days input{width:20px;height:20px}
.send{width:100%;margin-top:20px;padding:16px;font-size:1.1rem;font-weight:700;color:#fff;border:0;border-radius:12px;background:linear-gradient(135deg,#3a6bff,#7b4dff)}
.send:disabled{opacity:.6}
.err{color:#ff7b7b;margin-top:10px;min-height:1.2em}
.hint{color:var(--muted);font-size:.9rem}
.ok{display:none;text-align:center}.ok .tick{font-size:2.4rem;color:var(--ok)}
.badge{margin:14px auto 0;max-width:320px;border:2px dashed var(--line);border-radius:14px;padding:16px}
.badge .n{font-size:1.4rem;font-weight:800}.badge .t{color:var(--muted);letter-spacing:.08em}
</style>
</head>

<main>
<div class="card" id="reg">
  <div id="formBox">
    <h2>Регистрация</h2>
    <p class="hint">Please use Latin letters (English). / Пишите латинскими буквами.</p>
    <label for="sn">Surname / Фамилия</label><input type="text" id="sn" autocomplete="family-name" autocapitalize="characters" placeholder="IVANOV">
    <label for="nm">Name / Имя</label><input type="text" id="nm" autocomplete="given-name" autocapitalize="characters" placeholder="ALEX">
    <label for="tb">Employee ID / Табельный номер</label><input type="text" id="tb" autocapitalize="characters" placeholder="12345 / A1234">
    <label>Day / День участия</label>
    <div class="days"><label><input type="checkbox" value="1" class="dy"> Day 1 / День 1</label><label><input type="checkbox" value="2" class="dy"> Day 2 / День 2</label></div>
    <div class="err" id="err" role="alert"></div>
    <button class="send" id="send">Register / Зарегистрироваться</button>
  </div>
  <div class="ok" id="okBox">
    <div class="tick">✔</div><h2>Вы зарегистрированы!</h2>
    <p>Подойдите к принтеру за бейджем.</p>
    <div class="badge"><div class="n" id="bN"></div><div class="t" id="bT"></div></div>
    <p class="hint">Сохраните этот экран: он понадобится для викторины.</p>
    <button class="send" id="rpBtn" type="button" style="margin-top:10px">Бейдж порвался или потерян? Напечатать ещё раз</button>
    <div class="hint" id="rpMsg" role="status" style="margin-top:8px"></div>
  </div>
</div>
</main>
<script>
// Адрес Google Apps Script. Пока пусто: форма работает в демо-режиме.
var ENDPOINT="https://script.google.com/macros/s/AKfycbz4_nomoLxvBJ_vSz6Ci1d5_DgF79BM1iNYG323gnbV-ij0YMLF24NdZ-gibNwQKEj1Vw/exec";
var $=function(i){return document.getElementById(i)};
var lastTb="";
function showOk(sn,nm,tb,days){lastTb=tb;$("bN").textContent=sn+" "+nm;$("bT").textContent="№ "+tb+" · "+days.map(function(d){return"день "+d}).join(", ");$("formBox").style.display="none";$("okBox").style.display="block"}
try{var sv=JSON.parse(localStorage.getItem("reg")||"null");if(sv&&sv.tb)showOk(sv.sn,sv.nm,sv.tb,sv.days||[])}catch(x){}

function reprint(tb,msg,btn){
  tb=String(tb||"").trim().toUpperCase();
  if(!/^[0-9A-Z-]{2,12}$/.test(tb)){msg.textContent="ID: digits and Latin letters / Введите табельный номер";return}
  if(!ENDPOINT){msg.textContent="Демо-режим";return}
  btn.disabled=true;msg.textContent="…";
  fetch(ENDPOINT+"?action=reprint&tab="+encodeURIComponent(tb)).then(function(r){return r.text()}).then(function(t){
    t=t.trim();
    if(t==="ok")msg.textContent="Готово! Бейдж напечатается через несколько секунд, подойдите к принтеру. / Badge is printing, please go to the printer.";
    else if(t==="wait")msg.textContent="Запрос уже отправлен. Подождите минуту и подойдите к принтеру. / Request already sent, please wait a minute.";
    else if(t==="notfound")msg.textContent="Такой табельный номер не найден. Сначала зарегистрируйтесь. / ID not found, please register first.";
    else msg.textContent="Не получилось. Подойдите к стойке. / Failed, please go to the desk.";
    setTimeout(function(){btn.disabled=false},8000)})
  .catch(function(){msg.textContent="Нет связи. Попробуйте ещё раз или подойдите к стойке.";btn.disabled=false});
}
$("rpBtn").onclick=function(){reprint(lastTb,$("rpMsg"),$("rpBtn"))};
$("send").onclick=function(){
  var sn=$("sn").value.trim().toUpperCase(),nm=$("nm").value.trim().toUpperCase(),tb=$("tb").value.trim().toUpperCase();
  var days=[].slice.call(document.querySelectorAll(".dy:checked")).map(function(c){return c.value});
  var e=$("err");e.textContent="";
  if(!/^[A-Z][A-Z '-]{1,29}$/.test(sn)||!/^[A-Z][A-Z '-]{1,29}$/.test(nm)){e.textContent="Name: Latin letters only / Только латинские буквы";return}
  if(!/^[0-9A-Z-]{2,12}$/.test(tb)){e.textContent="ID: digits and Latin letters / Цифры и латинские буквы";return}
  if(!days.length){e.textContent="Select a day / Выберите день";return}
  var b=$("send");b.disabled=true;b.textContent="Отправляем…";
  function done(){lastTb=tb;try{localStorage.setItem("reg",JSON.stringify({sn:sn,nm:nm,tb:tb,days:days}))}catch(x){}$("bN").textContent=sn+" "+nm;$("bT").textContent="№ "+tb+" · "+days.map(function(d){return"день "+d}).join(", ");$("formBox").style.display="none";$("okBox").style.display="block"}
  if(!ENDPOINT){setTimeout(done,500);return}
  var ts=new Date().toISOString();
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(days.map(function(d){return{surname:sn,name:nm,tab:tb,day:d,ts:ts}}))})
  .then(done).catch(function(){e.textContent="Нет связи. Попробуйте ещё раз или подойдите к стойке.";b.disabled=false;b.textContent="Register / Зарегистрироваться"});
};
</script>
</body>
</html>
