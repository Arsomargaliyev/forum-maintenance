<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Станция печати v4</title>
<style id="pg">@page{size:58mm 40mm;margin:0}</style>
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0d1226;color:#eef1ff;padding:16px}
.c{max-width:640px;margin:0 auto}
.card{background:#161d38;border:1px solid #2a3560;border-radius:14px;padding:16px;margin-bottom:14px}
input,select,button{font-size:1rem;padding:10px;border-radius:8px;border:1px solid #2a3560;background:#0d1226;color:#eef1ff;margin:3px 0;width:100%}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
button{background:#3a6bff;border:0;font-weight:700}
.sm{color:#9aa6c8;font-size:.85rem}
#st{font-size:1.3rem;font-weight:700}#log{color:#9aa6c8;font-size:.9rem;min-height:1.3em}
/* этикетка 58x40 мм: имя и фамилия, текст сам уменьшается под длину */
#prev{max-width:640px;margin:0 auto 14px}
#badge{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.pg{position:relative;width:var(--pw);height:var(--ph);overflow:hidden;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.45);border-radius:1.5mm}
.lab{position:absolute;left:0;top:0;width:var(--lw);height:var(--lh);color:#000;background:#fff;font-family:"DIN Pro","DIN Alternate","Arial Narrow",Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.2mm 2.6mm;text-align:center}
.pg.rot .lab{transform-origin:0 0;transform:translateX(var(--pw)) rotate(90deg)}
.pg.rot.flip .lab{transform:translateY(var(--ph)) rotate(-90deg)}
.pg.flip:not(.rot) .lab{transform:rotate(180deg)}
.lab .n,.lab .s{width:100%;font-weight:800;line-height:1.02;letter-spacing:.01em;white-space:nowrap;overflow-wrap:anywhere}
.lab .s{font-weight:700;margin-top:1.2mm}
.lab .ln{width:62%;border-top:.35mm solid #000;margin:1.8mm 0 1.2mm}
.lab .i{font-size:3.6mm;font-weight:800;letter-spacing:.04em}
/* этикетка лотереи: сверху чёрная полоса с надписью и билетиком, ниже имя и фамилия как на первой */
.lab.lt{padding-top:calc(var(--bh) + 1.6mm)}
.lab .tg{position:absolute;top:0;left:0;right:0;height:var(--bh);background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:1.6mm;font-size:calc(var(--bh) * .52);font-weight:900;letter-spacing:.06em;line-height:1}
.lab .tg svg{height:calc(var(--bh) * .62);width:auto;flex:none}
@media print{html,body{background:#fff!important;padding:0;margin:0}.c,#prev .sm{display:none!important}#prev{margin:0;max-width:none}
  #badge{display:block}.pg{box-shadow:none;border-radius:0;page-break-after:always;break-after:page}.pg:last-child{page-break-after:auto;break-after:auto}}
</style>
</head>
<body>
<div class="c">
 <div class="card">
  <b>Подключение</b> <span class="sm">· версия: этикетка 58×40 v13</span>
  <input id="u" placeholder="Адрес скрипта (/exec)" value="https://script.google.com/macros/s/AKfycbzQtnSgbqqLDmFXDgPs_b5CV8SjHtJJYJOQzsit5gA16d4OPZCBN_1TKNJ7IWGGkhOWWg/exec"><input id="k" type="password" placeholder="Ключ">
  <div class="r"><input id="w" type="number" value="58"><span class="sm">ширина этикетки, мм</span><input id="h" type="number" value="40"><span class="sm">высота этикетки, мм</span></div>
  <label class="sm" style="display:block;margin:6px 0"><input type="checkbox" id="two" style="width:auto" checked> Две одинаковые этикетки на человека: на бейдж и в лототрон</label>
  <label class="sm" style="display:block;margin:6px 0"><input type="checkbox" id="flip" style="width:auto"> Развернуть на 180° (если печатается вверх ногами)</label>
  <div class="sm">Если принтер подаёт этикетку узкой стороной вперёд, поменяйте местами ширину и высоту: текст повернётся сам.</div>
  <div class="r"><button id="go">Старт</button><button id="tst" style="background:#2a3560">Тестовая печать</button></div>
 </div>
 <div class="card"><div id="st">Остановлено</div><div id="log"></div></div>
 <div class="card">
  <b>Выдача бейджей</b>
  <label style="display:block;margin:6px 0"><input type="checkbox" id="auto" style="width:auto" checked> Автопечать: бейдж печатается сразу после регистрации</label>
  <div id="wl"></div>
 </div>
 <div class="card">
  <b>Ручная регистрация (без телефона)</b>
  <div class="r"><input id="ms" placeholder="SURNAME"><input id="mn" placeholder="NAME"></div>
  <div class="r"><input id="mt" placeholder="ID"><select id="md"><option>1</option><option>2</option></select></div>
  <button id="add">Добавить и напечатать</button>
  <div id="dupm" style="display:none;margin-top:8px;padding:10px;border-radius:8px;background:#3a2a10;border:1px solid #a87a2a"><div id="dupt" style="margin-bottom:6px;font-weight:700"></div><button id="rpb" style="background:#c9962b;color:#111">Распечатать повторно</button></div>
 </div>
</div>
<div id="prev"><div class="sm" style="margin-bottom:8px">Предпросмотр этикеток</div><div id="badge">
 <div class="pg" id="p1"><div class="lab"><div class="n" id="aN"></div><div class="s" id="aS"></div></div></div>
 <div class="pg" id="p2"><div class="lab"><div class="n" id="bN"></div><div class="s" id="bS"></div></div></div></div>
</div></div>
<script>
var $=function(i){return document.getElementById(i)},q=[],wait=[],busy=false,printed=0,seen={},timer=null,U="",K="";
var KEEP=["u","k","w","h"];
KEEP.forEach(function(i){try{var v=localStorage.getItem("c_"+i);if(v)$(i).value=v}catch(e){}});
// раньше по умолчанию было 60 мм: один раз переводим сохранённую ширину на 58
try{if(!localStorage.getItem("c_v58")){if($("w").value==="60")$("w").value="58";if($("h").value==="60")$("h").value="58";localStorage.setItem("c_v58","1")}}catch(e){}
try{if(localStorage.getItem("c_two")==="0")$("two").checked=false;if(localStorage.getItem("c_flip")==="1")$("flip").checked=true}catch(e){}
function save(){try{KEEP.forEach(function(i){localStorage.setItem("c_"+i,$(i).value)});localStorage.setItem("c_two",$("two").checked?"1":"0");localStorage.setItem("c_flip",$("flip").checked?"1":"0")}catch(e){}}
function log(t){$("log").textContent=t}
function stat(){$("st").textContent="Ждут выдачи: "+wait.length+" · В печати: "+q.length+" · Напечатано: "+printed}
function api(a,x){return fetch(U+"?action="+a+"&key="+encodeURIComponent(K)+(x||""))}
// Страница на 2 мм короче этикетки по ходу ленты: так она никогда не заезжает на следующую,
// а к началу следующей этикетки принтер подгоняет ленту сам (по промежутку между этикетками).
var SPARE=2;
function size(){var pw=parseFloat($("w").value)||58,ph=(parseFloat($("h").value)||40)-SPARE,rot=ph>pw,st=document.documentElement.style;
  $("pg").textContent="@page{size:"+pw+"mm "+ph+"mm;margin:0}";
  st.setProperty("--pw",pw+"mm");st.setProperty("--ph",ph+"mm");st.setProperty("--lw",(rot?ph:pw)+"mm");st.setProperty("--lh",(rot?pw:ph)+"mm");
  ["p1","p2"].forEach(function(id){$(id).className="pg"+(rot?" rot":"")+($("flip").checked?" flip":"")});
  $("p2").style.display=$("two").checked?"":"none"}
// Подгонка: шрифт уменьшается, пока строка не влезет по ширине. Если и на минимуме не влезает
// (очень длинная фамилия), строка переносится, обычно по дефису: ABDRAKHMANOVA-/KUZNETSOVA.
function fit(el,max,min){el.style.whiteSpace="nowrap";var mm=max;el.style.fontSize=mm+"mm";
  while(el.scrollWidth>el.clientWidth+0.5&&mm>min){mm-=.2;el.style.fontSize=mm+"mm"}
  if(el.scrollWidth>el.clientWidth+0.5){el.style.whiteSpace="normal"}return mm}
// следим, чтобы всё влезло и по высоте
function fitLab(lab,nEl,sEl,nMax,sMax){var n=nMax,s=sMax;
  for(var k=0;k<40;k++){var a=fit(nEl,n,3.2),b=fit(sEl,Math.min(s,a),3);
    if(lab.scrollHeight<=lab.clientHeight+0.5)return;n=Math.max(3.2,n*.92);s=Math.max(3,s*.92)}}
function show(r){
  size();
  $("aN").textContent=$("bN").textContent=r.name;$("aS").textContent=$("bS").textContent=r.surname;
  var lh=Math.min(parseFloat($("w").value)||58,parseFloat($("h").value)||40),k=lh/40;   // крупнее/мельче вместе с размером этикетки
  fitLab($("p1").firstChild,$("aN"),$("aS"),11.5*k,8.5*k);
  fitLab($("p2").firstChild,$("bN"),$("bS"),11.5*k,8.5*k);
}
function printNow(r,cb){show(r);setTimeout(function(){window.print();setTimeout(cb,1500)},400)}
function render(){var el=$("wl");el.textContent="";wait.forEach(function(r){var d=document.createElement("div");d.className="r";var s=document.createElement("span");s.textContent=r.surname+" "+r.name+" · "+r.tab+" · день "+r.day;var bt=document.createElement("button");bt.textContent="Выдать бейдж";bt.onclick=function(){q.push(wait.splice(wait.indexOf(r),1)[0]);render();stat();next()};d.appendChild(s);d.appendChild(bt);el.appendChild(d)})}
function flush(){if($("auto").checked){q=q.concat(wait);wait=[]}render();stat();next()}
function why(m){
  if(/Forum registration/i.test(m))return "Скрипт ответил, но ключ не подошёл. Проверьте ключ в поле и в скрипте (KEY) и сделайте новую версию развёртывания.";
  if(/<|Sign in|accounts\.google/i.test(m))return "Скрипт просит вход в Google. Откройте доступ «Все» и «Выполнять от имени: Я».";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Запрос не дошёл: нет интернета, Google заблокирован на этом ноутбуке или адрес неверный. Попробуйте раздачу с телефона.";
  return m}
function poll(){api("pending").then(function(r){return r.text()}).then(function(t){
  var rows;try{rows=JSON.parse(t)}catch(e){throw new Error(t.slice(0,90).replace(/\s+/g," "))}
  rows.forEach(function(r){var sk=r.row+"|"+r.tab+"|"+(r.rp||"");if(!seen[sk]){seen[sk]=1;wait.push(r)}});flush();log("Работает, проверка каждые 3 с")})
  .catch(function(e){log("Нет связи: "+why(e.message||String(e)))})}
function next(){
  if(busy||!q.length)return;busy=true;var r=q.shift();
  printNow(r,function(){api("done","&row="+r.row).then(function(){printed++}).catch(function(){log("Не удалось отметить печать, строка "+r.row)}).then(function(){busy=false;stat();next()})});
}
function start(){U=$("u").value.trim();K=$("k").value.trim();if(!U||!K){log("Введите адрес и ключ и нажмите «Старт»");return}
  save();try{localStorage.setItem("c_auto","1")}catch(e){}size();clearInterval(timer);poll();timer=setInterval(poll,3000)}
$("go").onclick=start;
try{var hm=location.hash.match(/k=([^&]+)/);if(hm)$("k").value=decodeURIComponent(hm[1]);if($("k").value&&(hm||localStorage.getItem("c_auto")==="1"))start()}catch(e){}
$("tst").onclick=function(){if(busy)return;save();busy=true;
  printNow({surname:"ABDRAKHMANOVA-KUZNETSOVA",name:"ALEXANDER",tab:"12345",day:"1"},function(){busy=false;next()})};
$("auto").onchange=flush;
var PV={surname:"KASSYMOVA",name:"AIGERIM",tab:"777",day:"1"};
["w","h","two","flip"].forEach(function(i){$(i).addEventListener("input",function(){save();show(PV)})});
show(PV);
$("add").onclick=function(){
  var s=$("ms").value.trim().toUpperCase(),n=$("mn").value.trim().toUpperCase(),t=$("mt").value.replace(/\s+/g,"").toUpperCase();
  $("dupm").style.display="none";
  if(!s||!n||!t){log("Заполните фамилию, имя и ID");return}if(!timer)start();if(!U)return;
  $("add").disabled=true;
  fetch(U,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({key:K,rows:[{surname:s,name:n,tab:t,day:$("md").value}]})})
  .then(function(r){return r.text()}).then(function(x){var r;try{r=JSON.parse(x)}catch(e){r={err:x.slice(0,60)}}
    if(r.ok){["ms","mn","mt"].forEach(function(i){$(i).value=""});log("Добавлено, печать через пару секунд");setTimeout(poll,1500);return}
    if(r.err==="dup"){LT=r.tab||t;$("dupt").textContent="Уже зарегистрирован(а) сегодня: "+(r.surname||s)+" "+(r.name||n)+" · ID "+LT+". Новая строка в таблицу не добавлена.";$("dupm").style.display="block";return}
    log(r.err==="bad"?"Проверьте данные: только латинские буквы, ID — цифры и буквы":"Не сохранилось: "+r.err)})
  .catch(function(){log("Нет связи, попробуйте ещё раз")})
  .then(function(){$("add").disabled=false});
};
var LT="";
$("rpb").onclick=function(){if(!LT)return;$("rpb").disabled=true;
  fetch(U+"?action=reprint&tab="+encodeURIComponent(LT)).then(function(r){return r.text()}).then(function(x){x=x.trim();
    if(x==="ok"){$("dupm").style.display="none";["ms","mn","mt"].forEach(function(i){$(i).value=""});log("Отправлено на повторную печать");setTimeout(poll,1500)}
    else log(x==="wait"?"Повтор уже отправлен, подождите 30 секунд":x==="notfound"?"ID не найден":"Ошибка: "+x)})
  .catch(function(){log("Нет связи, попробуйте ещё раз")}).then(function(){$("rpb").disabled=false})};
</script>
</body>
</html>
